name: Render and deploy profile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - requirements.txt
      - .profile/profile.json
      - .profile/render.py
      - .profile/test_profile.py
      - .profile/templates/**
      - .github/workflows/render-profile.yml
  schedule:
    - cron: '17 3 * * 1'
      timezone: 'America/Sao_Paulo'
    - cron: '17 0 8 9 *'
      timezone: 'America/Sao_Paulo'
    - cron: '17 6 8 9 *'
      timezone: 'America/Sao_Paulo'
    - cron: '17 12 8 9 *'
      timezone: 'America/Sao_Paulo'

concurrency:
  group: profile-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    env:
      TZ: America/Sao_Paulo
      PROFILE_BIRTH_DATE: ${{ vars.PROFILE_BIRTH_DATE }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate birth-date repository variable
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PROFILE_BIRTH_DATE)) {
            throw 'PROFILE_BIRTH_DATE repository variable is required (YYYY-MM-DD).'
          }
          @'
          import os
          from datetime import date
          try:
              date.fromisoformat(os.environ['PROFILE_BIRTH_DATE'])
          except ValueError as error:
              raise SystemExit(f'PROFILE_BIRTH_DATE must use YYYY-MM-DD: {error}')
          '@ | python -
      - name: Install minimal renderer dependencies
        shell: pwsh
        run: python -m pip install --requirement requirements.txt
      - name: Test SVG generator
        shell: pwsh
        run: python .profile/test_profile.py
      - name: Generate static and animated SVG assets
        shell: pwsh
        run: python .profile/render.py
      - name: Validate generated assets
        shell: pwsh
        run: python .profile/test_profile.py --check-generated
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Commit changed generated assets
        id: assets
        shell: pwsh
        run: |
          git diff --quiet -- README.md dark_mode.svg light_mode.svg docs
          if ($LASTEXITCODE -eq 0) {
            'changed=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md dark_mode.svg light_mode.svg docs
          git commit -m 'chore(profile): atualizar assets SVG'
          git push
          'changed=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Keep scheduled renderer active after 30 quiet days
        if: github.event_name == 'schedule' && steps.assets.outputs.changed == 'false'
        shell: pwsh
        run: |
          $latestUnix = [int64](git log -1 --format=%ct)
          $latestCommit = [DateTimeOffset]::FromUnixTimeSeconds($latestUnix).UtcDateTime
          $ageDays = ([DateTime]::UtcNow - $latestCommit).TotalDays
          if ($ageDays -lt 30) {
            Write-Output "Latest commit is $([math]::Floor($ageDays)) days old; no keepalive commit needed."
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'chore(profile): manter renderizador agendado ativo'
          git push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
